{% extends 'hospital/base.html' %}
{% block shell %}
<div class="embed-done"><i class="bi bi-check-circle-fill"></i><p>{{ message }}</p></div>
{{ message|json_script:"done-msg" }}{{ go|default:''|json_script:"done-go" }}
<script>
  // Tell the page that opened this panel that we are finished, so it can close the panel and refresh in place.
  const msg = JSON.parse(document.getElementById('done-msg').textContent);
  const go = JSON.parse(document.getElementById('done-go').textContent);   // optional: open this page next instead of refreshing
  if (window.parent !== window) window.parent.postMessage({type: 'medflow:done', message: msg, url: go}, window.location.origin);
  else window.location.href = go || '/';
</script>
{% endblock %}
