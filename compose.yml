# Local development / demo stack: SQLite, DEBUG on, demo data, live code reload.
#   docker compose up -d --build
# Never use this file for real patient data. Production: docker compose -f compose.prod.yml up -d --build
name: medflow-dev
services:
  web:
    build: .
    command: ["sh", "/app/dev-start.sh"]
    environment:
      DJANGO_DEBUG: "True"
      USE_SQLITE: "True"
      SQLITE_PATH: /data/db.sqlite3
      DJANGO_SECRET_KEY: dev-only-insecure-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: medflow-admin-2026
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app            # edit code on your machine, the server reloads
      - medflow_dev_data:/data
volumes:
  medflow_dev_data:
